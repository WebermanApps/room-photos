<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Room Photos</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--mute:#6e6e73;--line:#d2d2d7;--blue:#0071e3;--fill:#f2f2f4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:17px;line-height:1.47;letter-spacing:-.01em;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:rgba(245,245,247,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);padding:calc(12px + env(safe-area-inset-top)) 20px 0}
header h1{font-size:15px;font-weight:600;margin:0 0 10px;color:var(--mute);letter-spacing:-.01em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pb{height:3px;background:#e5e5ea;margin:0 -20px;overflow:hidden}#pb i{display:block;height:100%;width:0;background:var(--ink);transition:width .4s ease}
main{padding:20px 20px 0;max-width:640px;margin:0 auto 130px}
h2{font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.025em;margin:28px 4px 14px}
h3{font-size:30px;line-height:1.12;font-weight:700;letter-spacing:-.028em;margin:6px 0 16px}
.card{background:var(--card);border-radius:20px;padding:22px 20px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 20px rgba(0,0,0,.04)}
.card>p:first-child{margin-top:0}
.card h2{margin:0 0 14px;font-size:30px}
button,.btn{font-family:inherit;font-size:17px;font-weight:600;letter-spacing:-.01em;min-height:50px;border-radius:999px;border:0;padding:13px 22px;cursor:pointer;transition:transform .15s ease,background-color .2s ease,opacity .2s ease}
button:active,.btn:active{transform:scale(.98)}button:disabled{opacity:.5}
.pri,.grn{background:var(--blue);color:#fff}.pri:hover,.grn:hover{background:#0077ed}
.sec{background:#e8e8ed;color:var(--ink)}
.stop{display:flex;width:100%;text-align:left;align-items:center;gap:14px;background:var(--card);margin-bottom:10px;color:var(--ink);border-radius:18px;padding:18px 20px;min-height:76px;font-size:19px;font-weight:600;letter-spacing:-.02em;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 20px rgba(0,0,0,.04)}
.stop .t{flex:1}.stop>span:last-child{color:#c7c7cc;font-size:26px;font-weight:300}
.bar{height:3px;background:#e5e5ea;border-radius:2px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ink);transition:width .4s ease}
.cnt{font-size:14px;color:var(--mute);font-weight:400;letter-spacing:0}
.conf{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;color:#b25000;background:#fff4e5;border-radius:999px;padding:2px 9px;vertical-align:middle}
h3 .conf{font-size:12px;margin-left:4px;vertical-align:.35em}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--mute);text-transform:none;letter-spacing:0;margin-bottom:4px}
p .lbl{margin-bottom:2px}
.sample{margin:20px -20px;text-align:left}.sample img{display:block;width:100%;max-height:340px;object-fit:contain;background:#fbfbfd;border-radius:18px}.sample.diag img{max-height:none;background:#fff;border:1px solid #e8e8ed}.sample div{font-size:13px;color:var(--mute);padding:10px 20px 0;line-height:1.4}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.thumbs:empty{margin:0}.thumbs div{position:relative}.thumbs img{width:92px;height:92px;object-fit:cover;border-radius:14px;display:block}
.thumbs button{position:absolute;top:-7px;right:-7px;min-height:28px;width:28px;padding:0;border-radius:50%;background:rgba(29,29,31,.8);color:#fff;font-size:17px;line-height:28px;font-weight:400}
.check{display:flex;align-items:center;gap:14px;font-size:17px;font-weight:600;margin:20px 0;padding:16px 18px;background:var(--fill);border-radius:14px;cursor:pointer;transition:background-color .2s ease,color .2s ease}
.check input{appearance:none;-webkit-appearance:none;margin:0;width:28px;height:28px;border-radius:50%;border:2px solid #c7c7cc;background:#fff;display:grid;place-content:center;transition:all .2s ease;flex:none}
.check input::after{content:"";width:12px;height:7px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:translateY(-2px) rotate(-45deg) scale(0);transition:transform .2s ease}
.check input:checked{background:#34c759;border-color:#34c759}.check input:checked::after{transform:translateY(-2px) rotate(-45deg) scale(1)}
.check:has(input:checked){background:#eaf8ee}
input[type=text],textarea{width:100%;font-family:inherit;font-size:17px;color:var(--ink);background:var(--fill);border:1.5px solid transparent;border-radius:12px;padding:14px 16px;outline:none;transition:border-color .2s ease,background-color .2s ease}
input[type=text]:focus,textarea:focus{background:#fff;border-color:var(--blue)}
textarea{min-height:100px;resize:vertical;display:block}
#sn,#fs{font-family:"SF Mono",ui-monospace,Menlo,monospace;letter-spacing:.06em;margin-bottom:18px}
.walk{display:flex;gap:12px;align-items:flex-start}.walk .ic{flex:none;width:28px;height:28px;border-radius:50%;background:#e8f1fd;color:var(--blue);display:grid;place-content:center;font-size:15px;font-weight:700;margin-top:1px}
.kicker{font-size:13px;font-weight:600;color:var(--blue);letter-spacing:0;margin-bottom:6px}
.exit{box-shadow:0 0 0 1.5px rgba(0,113,227,.35),0 4px 20px rgba(0,113,227,.06)}.exit h2{margin-bottom:12px}.exit .check{margin:10px 0;font-weight:500;line-height:1.35}
.xrow{box-shadow:0 0 0 1.5px rgba(0,113,227,.3),0 4px 20px rgba(0,0,0,.04)}.xrow .k{font-size:13px;font-weight:600;color:var(--blue);letter-spacing:0}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid rgba(0,0,0,.08);padding:12px 20px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px}
.nav button{flex:1;padding:13px 10px}.nav .pri,.nav .grn{flex:1.6}
.cam{display:flex;align-items:center;justify-content:center;width:100%;margin-top:10px}
label.cam:not(.sec){background:var(--blue);color:#fff}
.cam input{display:none}
ul{padding-left:20px;margin:0}li{margin-bottom:12px}li::marker{color:var(--mute)}
.wide{width:100%;margin-top:6px}
.ck{margin:10px 0;font-weight:500}.ck+.check:not(.ck){margin-top:20px}.bring h2{font-size:24px;margin-bottom:10px}.bring li{margin-bottom:6px}
.sum{font-size:15px;color:var(--mute);text-align:center;background:none;box-shadow:none;padding:10px 20px}.sum b{color:var(--ink)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chips button{min-height:36px;padding:4px 12px;font-size:15px;font-weight:500;background:#e8e8ed;color:var(--ink)}
.chips button.on{background:var(--blue);color:#fff}.chips button.cv{background:#fff4e5;color:#b25000}.chips button.cv.on{background:#b25000;color:#fff}
.ph{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid #eee}.ph img{width:84px;height:84px;object-fit:cover;border-radius:12px;flex:none}.ph .x{min-height:30px;padding:2px 10px;font-size:13px;background:none;color:#c00}
.lv{font-size:13px;font-weight:600;color:var(--mute);margin:22px 4px 8px}
.stop{min-height:60px;padding:12px 18px;font-size:17px}
</style><style>

:root{--bg:#fff;--card:#fff;--ink:#0a0a0a;--mute:#737373;--line:#e5e5e5;--blue:#171717;--fill:#f5f5f5}
body{font-family:Hind,-apple-system,Helvetica,Arial,sans-serif;background:#fafafa}
h2,h3{font-family:Khand,Hind,sans-serif;font-weight:700;letter-spacing:-.025em}
header{background:rgba(255,255,255,.9);border-bottom:1px solid #e5e5e5}header .logo{display:block;height:20px;width:auto;margin:0 auto 6px}
header h1{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#737373}
#pb{background:#e5e5e5}#pb i{background:#171717}
.card,.stop{border-radius:0;border:1px solid #e5e5e5;box-shadow:none}
button,.btn{border-radius:0;text-transform:uppercase;letter-spacing:1.4px;font-size:14px;font-weight:700}
.pri,.grn,label.cam:not(.sec){background:#F3EDE2;color:#0a0a0a;border:2px solid #171717}.pri:hover{background:#EDE4D3}
.sec{background:#fff;color:#171717;border:1px solid #171717}
.stop{text-transform:none;letter-spacing:-.01em;font-size:17px}
.kicker,.lv,.lbl{text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:#737373}
.chips button{border-radius:0;text-transform:none;letter-spacing:0;border:1px solid #d4d4d4;background:#fff}.chips button.on{background:#F3EDE2;color:#0a0a0a;border-color:#171717}
.chips button.cv{background:#fff;color:#df2225;border-color:#df2225}.chips button.cv.on{background:#df2225;color:#fff}
.ph .x{border:0;color:#df2225;letter-spacing:.05em;font-size:12px}
input[type=text],textarea,select{border-radius:0!important;border:1px solid #e5e5e5!important;background:#fff!important}
.ph img{border-radius:0}

/* MW polish layer: /workspace/ops/brand/app-polish-spec.md (Oct 10, 2026). Light mode, brand motion, 44px targets. */
:root{--mw-ease:cubic-bezier(.2,.8,.2,1);--mw-dur:180ms;--mw-ink:#171717;--mw-grey:#737373;--mw-line:#E5E5E5;--mw-jungle:#0B6E4F;--mw-lagoon:#05668D;--mw-terra:#C1502E}
html{color-scheme:light only}
:where(button,.btn,a.btn,[role=button]){transition:translate var(--mw-dur) var(--mw-ease),scale var(--mw-dur) var(--mw-ease),box-shadow var(--mw-dur) var(--mw-ease),background-color var(--mw-dur) var(--mw-ease)}
@media (hover:hover){:where(button,.btn,a.btn):not(:disabled):not(.leaflet-container *):hover{translate:0 -1px;scale:1.03;box-shadow:0 6px 18px rgba(10,10,10,.12)}}
:where(button,.btn):not(:disabled):not(.leaflet-container *):active{scale:.97}
:where(a:not(.btn)){text-underline-offset:4px}
:focus-visible{outline:2px solid var(--mw-lagoon);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.mw-share{min-height:44px;min-width:44px;padding:0 14px;border:2px solid var(--mw-ink);background:#fff;color:var(--mw-ink);font-family:Khand,Hind,system-ui,sans-serif;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;border-radius:0;cursor:pointer}
.mw-share-float{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:50}

/* Room Photos: Khand headings, condensed A-Z room rows, lagoon photo-count badge */
h1,h2,h3{font-family:Khand,Hind,sans-serif!important;font-weight:700!important;letter-spacing:0!important}
.stop{min-height:48px!important;padding:6px 14px!important;margin-bottom:4px!important;border-radius:10px!important;font-size:16px!important}
.stop .cnt{font-size:12px}
.lv{font-family:Khand,Hind,sans-serif;font-weight:700;font-size:15px!important;letter-spacing:.06em;text-transform:uppercase;color:var(--mw-ink)!important;margin:16px 4px 6px!important}

<style id="rp-niko">
.rp-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rp-seg{display:inline-flex;border:2px solid #6B5E50;border-radius:999px;overflow:hidden}
.rp-seg button{min-height:44px!important;min-width:64px;padding:0 14px!important;border:0!important;border-radius:0!important;background:#fff!important;color:#6B5E50!important;font:700 13px Khand,Hind,sans-serif!important;letter-spacing:.08em;text-transform:uppercase}
.rp-seg button.on{background:#6B5E50!important;color:#fff!important}
.rp-shareall{width:100%;margin:0 0 6px}
.rp-row{background:#fff;border:1px solid #E5E5E5;border-radius:12px;margin-bottom:6px;overflow:hidden}
.rp-head{display:flex!important;align-items:center;gap:10px;width:100%;min-height:48px!important;padding:6px 14px!important;background:#fff!important;border:0!important;border-radius:0!important;text-align:left;color:#171717!important;font:600 16px Hind,system-ui,sans-serif!important;letter-spacing:0!important;text-transform:none!important;box-shadow:none!important}
.rp-head .t{flex:1}
.rp-badge{min-width:26px;height:22px;padding:0 7px;border-radius:999px;background:#05668D;color:#fff;font:700 12px Hind,sans-serif;display:inline-flex;align-items:center;justify-content:center}
.rp-badge.zero{background:#F5F5F5;color:#737373}
.rp-chev{color:#A3A3A3;font-size:22px;transition:rotate .18s}

.rp-row:not(.open) .rp-body{display:none}
.rp-body{padding:0 12px 12px}

.rp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}
.rp-grid figure{margin:0}.rp-grid figcaption{font-size:12px;font-weight:600;color:#171717;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<script>
"use strict";
const LEVELS=[
["01-basement","Basement",["Living Area 004","Wine 008","Family Suite 002","Bathroom 005","Closet 001","Gym 012","Locker Room 013","Pool Storage 014","Pool Storage 011","Storage 009","Mech Room 010"]],
["02-first-floor","First Floor",["Vestibule 123","Foyer 110","Antechamber 113","Office 103","Antechamber 106","Closet 107","Gallery 111","Greatroom 112","Dining Room 118","Kitchen 117","Pantry 120","Living Room 121","Lanai 122","Mud Room 116","Half Bath 115","Stair Well 108","Primary Bedroom 105","Primary Closet 104","Primary Bathroom 102"]],
["03-second-floor","Second Floor",["Hall 205","Laundry 203","Bedroom 201","Closet 202","Bathroom 204","Bedroom 206","Bedroom 208","Bathroom 210","Closet 209","Closet 211","Shoe Den 213"]],
["04-garages","Garages",["Garage 101","Garage 119"]],
["05-exterior","Exterior",["Front of the House","Back of the House","Sides and Driveway"]]];
const TAGS=["Wide","Floor","Walls","Tile","Counter","Cabinets","Fixtures","Other"];
const KEY="roomPhotos_v1";
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{pos:null,extra:[],notes:{},tags:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(S));}
function rooms(){const r=[];LEVELS.forEach(([k,n,l])=>l.forEach(x=>r.push({id:k+"|"+x,lk:k,lv:n,name:x})));S.extra.forEach((e,i)=>{const L=LEVELS.find(l=>l[0]===e.lk)||LEVELS[1];r.push({id:"x"+i+"|"+e.name,lk:L[0],lv:L[1],name:e.name});});return r;}
let db;function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open("roomPhotos1",1);r.onupgradeneeded=()=>{r.result.createObjectStore("p",{keyPath:"id",autoIncrement:true}).createIndex("item","item");};r.onsuccess=()=>{db=r.result;ok();};r.onerror=()=>no(r.error);});}
function tx(m){return db.transaction("p",m).objectStore("p");}
function addPhoto(item,blob,name){return new Promise(ok=>{const r=tx("readwrite").add({item,blob,name:name||"",t:Date.now()});r.onsuccess=()=>ok(r.result);});}
function photos(item){return new Promise(ok=>{const r=tx("readonly").index("item").getAll(item);r.onsuccess=()=>ok(r.result.sort((a,b)=>a.id-b.id));});}
function allPhotos(){return new Promise(ok=>{const r=tx("readonly").getAll();r.onsuccess=()=>ok(r.result.sort((a,b)=>a.id-b.id));});}
function delPhoto(pid){return new Promise(ok=>{const r=tx("readwrite").delete(pid);r.onsuccess=()=>ok();});}
async function counts(){const c={};(await allPhotos()).forEach(p=>c[p.item]=(c[p.item]||0)+1);return c;}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const m=document.getElementById("m"),nav=document.getElementById("nav"),hd=document.getElementById("hd");
let urls=[];function freeUrls(){urls.forEach(u=>URL.revokeObjectURL(u));urls=[];}
function prog(f){document.querySelector("#pb i").style.width=(100*f)+"%";}
// downscale to ~2000px JPEG; keep original if the browser cannot decode (e.g. HEIC on some browsers)
async function shrink(f){try{let bmp;try{bmp=await createImageBitmap(f,{imageOrientation:"from-image"});}catch(e){bmp=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(f);});}
 const w=bmp.width,h=bmp.height,s=Math.min(1,2000/Math.max(w,h));const c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
 const b=await new Promise(ok=>c.toBlob(ok,"image/jpeg",0.85));return b||f;}catch(e){return f;}}
let OPEN=null,VIEW="list";
async function home(){S.pos=null;save();freeUrls();hd.textContent="Room Photos";const R=rooms(),c=await counts();const done=R.filter(r=>c[r.id]).length;prog(done/R.length);
 let tot=Object.values(c).reduce((a,b)=>a+b,0);
 let h=`<div class="rp-top"><h2>Room Photos</h2><div class="rp-seg" role="tablist"><button class="${VIEW==="list"?"on":""}" onclick="setView('list')">List</button><button class="${VIEW==="grid"?"on":""}" onclick="setView('grid')">Grid</button></div></div>
 <p class="cnt" style="margin:0 2px 10px">${done} of ${R.length} rooms have photos · ${tot} photos. Tap a room to see or add its photos.</p>
 <button class="pri wide rp-shareall" onclick="share('')"${tot?"":" disabled"}>Share All Photos At Once</button>`;
 if(VIEW==="grid"){h+=`<div id="rpgrid" class="rp-grid"></div>`;}
 else LEVELS.forEach(([k,n])=>{h+=`<div class="lv">${n}</div>`;R.map((r,i)=>[r,i]).sort((a,b)=>a[0].name.localeCompare(b[0].name,"en",{numeric:true})).forEach(([r,i])=>{if(r.lk!==k)return;const n2=c[r.id]||0;
  h+=`<div class="rp-row${OPEN===r.id?" open":""}" data-id="${esc(r.id)}"><button class="rp-head" aria-expanded="${OPEN===r.id}" onclick="toggleRoom(${i})"><span class="t">${esc(r.name)}</span><span class="rp-badge${n2?"":" zero"}">${n2}</span><span class="rp-chev">›</span></button><div class="rp-body"></div></div>`;});});
 h+=`<div class="card"><h2 style="font-size:22px">Add a Room</h2><input type="text" id="xn" placeholder="Room name"><select id="xl" style="width:100%;margin-top:10px;font-size:17px;padding:12px;border-radius:12px">${LEVELS.map(l=>`<option value="${l[0]}">${l[1]}</option>`).join("")}</select><button class="sec wide" style="margin-top:10px" onclick="addRoom()">Add Room</button></div>`;
 m.innerHTML=h;nav.innerHTML=`<button class="sec" onclick="go(${S.last||0})">Room By Room</button><button class="pri" onclick="finishPage()">Finish and Share</button>`;
 if(VIEW==="grid")grid();else if(OPEN){const i=R.findIndex(r=>r.id===OPEN);if(i>=0)fillRoom(i);}
}
function setView(v){VIEW=v;home();}
async function toggleRoom(i){const R=rooms(),r=R[i];const was=OPEN===r.id;OPEN=was?null:r.id;
 m.querySelectorAll(".rp-row").forEach(e=>{const on=e.dataset.id===OPEN;e.classList.toggle("open",on);e.querySelector(".rp-head").setAttribute("aria-expanded",on);if(!on)e.querySelector(".rp-body").innerHTML="";});
 if(!was)await fillRoom(i);}
async function fillRoom(i){const R=rooms(),r=R[i];const row=[...m.querySelectorAll(".rp-row")].find(e=>e.dataset.id===r.id);if(!row)return;const body=row.querySelector(".rp-body");const ps=await photos(r.id);
 const slides=ps.map((p,j)=>{const u=URL.createObjectURL(p.blob);urls.push(u);return `<figure class="rp-slide"><img src="${u}" alt="${esc(r.name)} photo ${j+1}" loading="lazy"><figcaption>${j+1} / ${ps.length}</figcaption></figure>`}).join("");

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,tm,true);h.setUint16(12,dt,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
  parts.push(h.buffer,nm,data);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,tm,true);c.setUint16(14,dt,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
  cen.push(c.buffer,nm);off+=30+nm.length+data.length;}
 const cs=cen.reduce((a,b)=>a+(b.byteLength),0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);

const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);
async function buildZip(lk){const R=rooms(),byId=new Map(R.map(r=>[r.id,r]));const all=await allPhotos();const files=[],cnt=new Map(),notes=[];
 for(const p of all){const r=byId.get(p.item);if(!r||(lk&&r.lk!==lk))continue;const t=S.tags[p.id]||{};const tg=t.tag?slug(t.tag)+(t.covered?"-covered":""):"photo";
  const key=r.id+tg,n=(cnt.get(key)||0)+1;cnt.set(key,n);const ty=(p.blob.type||"").toLowerCase(),on=(p.name||"").toLowerCase();
